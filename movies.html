<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Каталог Филми</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 2.2em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        /* --- Статистика --- */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px 25px;
            text-align: center;
            min-width: 140px;
        }
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffd200;
        }
        .stat-label {
            font-size: 0.8em;
            color: #999;
            margin-top: 4px;
        }

        /* --- Форма --- */
        .form-container {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 25px;
            max-width: 700px;
            margin: 0 auto 30px;
        }
        .form-container h2 {
            margin-bottom: 15px;
            font-size: 1.1em;
            color: #ccc;
        }
        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .form-row input, .form-row select {
            flex: 1;
            min-width: 120px;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 0.95em;
            outline: none;
            transition: border 0.2s;
        }
        .form-row input:focus, .form-row select:focus {
            border-color: #ffd200;
        }
        .form-row select option { background: #2a2a4a; }
        .btn-add {
            padding: 10px 24px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .btn-add:hover { transform: scale(1.05); }

        /* --- Търсене и филтър --- */
        .filter-bar {
            display: flex;
            gap: 10px;
            max-width: 700px;
            margin: 0 auto 25px;
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 0.95em;
            outline: none;
        }
        .filter-bar input:focus, .filter-bar select:focus {
            border-color: #ffd200;
        }

        /* --- Списък с филми --- */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .movie-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 210, 0, 0.3);
        }
        .movie-title {
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }
        .movie-meta {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 12px;
        }
        .movie-meta span {
            background: rgba(255,255,255,0.08);
            padding: 2px 8px;
            border-radius: 6px;
            margin-right: 6px;
        }

        /* --- Звезди за оценка --- */
        .stars {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
        }
        .star {
            font-size: 1.5em;
            cursor: pointer;
            color: #555;
            transition: color 0.15s, transform 0.15s;
        }
        .star:hover, .star.active {
            color: #ffd200;
            transform: scale(1.15);
        }
        .star.filled { color: #ffa500; }

        .rating-info {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 10px;
        }

        /* --- Бутони --- */
        .btn-delete {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #666;
            font-size: 1.2em;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-delete:hover { color: #ff4444; }

        .empty-state {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 1.1em;
        }
        .empty-state .icon { font-size: 3em; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h1>🎬 Каталог Филми</h1>
    <p class="subtitle">Flask + SQLAlchemy + SQLite • CRUD + Рейтинг система</p>

    <!-- Статистика -->
    <div class="stats-bar" id="statsBar">
        <div class="stat-item">
            <div class="stat-value" id="statTotal">0</div>
            <div class="stat-label">Филми</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statAvg">—</div>
            <div class="stat-label">Средна оценка</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="statGenres">0</div>
            <div class="stat-label">Жанрове</div>
        </div>
    </div>

    <!-- Форма за добавяне -->
    <div class="form-container">
        <h2>➕ Добави нов филм</h2>
        <form id="movieForm" class="form-row">
            <input type="text" id="title" placeholder="Заглавие" required>
            <select id="genre" required>
                <option value="">— Жанр —</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Horror">Horror</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Thriller">Thriller</option>
                <option value="Animation">Animation</option>
                <option value="Documentary">Documentary</option>
            </select>
            <input type="number" id="year" placeholder="Година" min="1900" max="2026" required>
            <button type="submit" class="btn-add">Добави</button>
        </form>
    </div>

    <!-- Търсене -->
    <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍 Търси по заглавие...">
        <select id="genreFilter">
            <option value="">Всички жанрове</option>
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Horror">Horror</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Thriller">Thriller</option>
            <option value="Animation">Animation</option>
            <option value="Documentary">Documentary</option>
        </select>
    </div>

    <!-- Списък с филми -->
    <div class="movies-grid" id="moviesGrid"></div>

    <script>
        const API = "http://localhost:5001";

        // --- Зареждане на филми ---
        async function loadMovies() {
            const search = document.getElementById("searchInput").value;
            const genre = document.getElementById("genreFilter").value;

            let url = `${API}/movies?`;
            if (search) url += `search=${encodeURIComponent(search)}&`;
            if (genre) url += `genre=${encodeURIComponent(genre)}`;

            const res = await fetch(url);
            const movies = await res.json();
            const grid = document.getElementById("moviesGrid");

            if (movies.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <div class="icon">🎬</div>
                        <p>Няма намерени филми. Добавете първия!</p>
                    </div>`;
                return;
            }

            grid.innerHTML = movies.map(movie => `
                <div class="movie-card">
                    <button class="btn-delete" onclick="deleteMovie(${movie.id})" title="Изтрий">✕</button>
                    <div class="movie-title">${escapeHtml(movie.title)}</div>
                    <div class="movie-meta">
                        <span>${movie.genre}</span>
                        <span>${movie.year}</span>
                    </div>
                    <div class="stars" data-movie-id="${movie.id}">
                        ${[1,2,3,4,5].map(i => `
                            <span class="star ${i <= Math.round(movie.rating) ? 'filled' : ''}"
                                  onclick="rateMovie(${movie.id}, ${i})"
                                  onmouseenter="highlightStars(this, ${i})"
                                  onmouseleave="resetStars(this, ${Math.round(movie.rating)})">★</span>
                        `).join('')}
                    </div>
                    <div class="rating-info">
                        ${movie.rating > 0 ? `⭐ ${movie.rating} / 5 (${movie.rating_count} гласа)` : 'Все още няма оценки'}
                    </div>
                </div>
            `).join('');
        }

        // --- Статистика ---
        async function loadStats() {
            const res = await fetch(`${API}/movies/stats`);
            const stats = await res.json();
            document.getElementById("statTotal").textContent = stats.total_movies;
            document.getElementById("statAvg").textContent = stats.average_rating > 0 ? `⭐ ${stats.average_rating}` : '—';
            document.getElementById("statGenres").textContent = Object.keys(stats.genres).length;
        }

        // --- Добавяне на филм ---
        document.getElementById("movieForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const title = document.getElementById("title").value;
            const genre = document.getElementById("genre").value;
            const year = document.getElementById("year").value;

            await fetch(`${API}/movies`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, genre, year: parseInt(year) })
            });

            // Зануляване на формата
            document.getElementById("movieForm").reset();
            loadMovies();
            loadStats();
        });

        // --- Гласуване ---
        async function rateMovie(movieId, rating) {
            await fetch(`${API}/movies/${movieId}/rate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ rating })
            });
            loadMovies();
            loadStats();
        }

        // --- Изтриване ---
        async function deleteMovie(movieId) {
            if (!confirm("Сигурни ли сте, че искате да изтриете този филм?")) return;
            await fetch(`${API}/movies/${movieId}`, { method: "DELETE" });
            loadMovies();
            loadStats();
        }

        // --- Hover ефект за звезди ---
        function highlightStars(star, rating) {
            const stars = star.parentElement.querySelectorAll('.star');
            stars.forEach((s, i) => {
                s.classList.toggle('active', i < rating);
            });
        }
        function resetStars(star, currentRating) {
            const stars = star.parentElement.querySelectorAll('.star');
            stars.forEach((s, i) => {
                s.classList.remove('active');
            });
        }

        // --- Защита от XSS ---
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- Търсене с debounce ---
        let searchTimeout;
        document.getElementById("searchInput").addEventListener("input", () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadMovies, 300);
        });
        document.getElementById("genreFilter").addEventListener("change", loadMovies);

        // --- Първоначално зареждане ---
        loadMovies();
        loadStats();
    </script>
</body>
</html>
