<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            margin-bottom: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        button {
            padding: 5px 10px;
            margin-left: 5px;
            border: none;
            cursor: pointer;
            border-radius: 3px;
        }
        .delete-button {
            background-color: red;
            color: white;
        }
        .sell-button {
            background-color: green;
            color: white;
        }
        .show-sold-button {
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <h2>Book Management System</h2>
    <form id="bookForm">
        <input type="text" id="title" placeholder="Book Title" required>
        <input type="text" id="author" placeholder="Author" required>
        <button type="submit">Add Book</button>
    </form>
    <button id="loadBooksButton">Show Books</button>
    <button id="hideBooksButton" style="display: none;">Hide Books</button>
    <button id="showSoldBooksButton" class="show-sold-button">Show Sold Books</button>
    <button id="hideSoldBooksButton" style="display: none;" class="show-sold-button">Hide Sold Books</button>
    <ul id="bookList"></ul>
    <ul id="soldBookList"></ul>
    
    <script>
        document.getElementById("bookForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const title = document.getElementById("title").value;
            const author = document.getElementById("author").value;

            await fetch("http://localhost:5000/books", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, author })
            });

            document.getElementById("title").value = "";
            document.getElementById("author").value = "";
        });

        document.getElementById("loadBooksButton").addEventListener("click", function() {
            loadBooks();
            document.getElementById("hideBooksButton").style.display = "inline-block";
            document.getElementById("loadBooksButton").style.display = "none";
        });

        document.getElementById("hideBooksButton").addEventListener("click", function() {
            document.getElementById("bookList").innerHTML = "";
            document.getElementById("hideBooksButton").style.display = "none";
            document.getElementById("loadBooksButton").style.display = "inline-block";
        });

        document.getElementById("showSoldBooksButton").addEventListener("click", function() {
            loadSoldBooks();
            document.getElementById("hideSoldBooksButton").style.display = "inline-block";
            document.getElementById("showSoldBooksButton").style.display = "none";
        });

        document.getElementById("hideSoldBooksButton").addEventListener("click", function() {
            document.getElementById("soldBookList").innerHTML = "";
            document.getElementById("hideSoldBooksButton").style.display = "none";
            document.getElementById("showSoldBooksButton").style.display = "inline-block";
        });

        async function loadBooks() {
            const response = await fetch("http://localhost:5000/books");
            const books = await response.json();
            const bookList = document.getElementById("bookList");
            bookList.innerHTML = books.map(book => `
                <li>
                    ${book.title} by ${book.author}
                    <button class="delete-button" onclick="deleteBook(${book.id})">Delete</button>
                    <button class="sell-button" onclick="sellBook(${book.id})">Sell</button>
                </li>
            `).join("");
        }

        async function loadSoldBooks() {
            const response = await fetch("http://localhost:5000/books/sold");
            const books = await response.json();
            const soldBookList = document.getElementById("soldBookList");
            soldBookList.innerHTML = books.map(book => `
                <li>
                    ${book.title} by ${book.author} - Sold for $${book.price}
                </li>
            `).join("");
        }

        async function deleteBook(bookId) {
            await fetch(`http://localhost:5000/books/${bookId}`, {
                method: "DELETE"
            });
            loadBooks();
        }

        async function sellBook(bookId) {
            const price = prompt("Enter the selling price:");
            if (price !== null && price.trim() !== "") {
                await fetch(`http://localhost:5000/books/sell/${bookId}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ price: parseInt(price.trim()) })
                });
                loadBooks(); // Reload books after selling
            }
        }
    </script>
</body>
</html>
